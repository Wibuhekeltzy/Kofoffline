
name: Copy GitHub Releases

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Original repository (OWNER/REPO)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  copy-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Copy all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source_repo }}
          TARGET: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Source: $SOURCE"
          echo "Destination: $TARGET"

          # Fetch source releases
          gh api --paginate --slurp \
            "repos/$SOURCE/releases?per_page=100" \
            > source.json

          # Fetch destination releases
          gh api --paginate --slurp \
            "repos/$TARGET/releases?per_page=100" \
            > target.json

          count=$(jq '[.[][]] | length' source.json)
          echo "Found $count source releases."

          if [[ "$count" -eq 0 ]]; then
            echo "No releases found."
            exit 0
          fi

          jq -c '.[][]' source.json |
          while IFS= read -r release; do

            tag=$(jq -r '.tag_name' <<< "$release")
            name=$(jq -r '.name // .tag_name' <<< "$release")
            body=$(jq -r '.body // ""' <<< "$release")
            draft=$(jq -r '.draft' <<< "$release")
            prerelease=$(jq -r '.prerelease' <<< "$release")
            target_commitish=$(jq -r '.target_commitish // "main"' <<< "$release")
            assets=$(jq '.assets | length' <<< "$release")

            echo "Processing: $tag"

            # Safely find an existing release
            target_id=$(jq -r --arg tag "$tag" \
              '[.[][] | select(.tag_name == $tag) | .id][0] // empty' \
              target.json)

            if [[ -n "$target_id" ]]; then
              echo "Updating existing release..."

              gh api --method PATCH \
                "repos/$TARGET/releases/$target_id" \
                -f name="$name" \
                -f body="$body" \
                -F draft="$draft" \
                -F prerelease="$prerelease" \
                >/dev/null
            else
              echo "Creating new release..."

              gh api --method POST \
                "repos/$TARGET/releases" \
                -f tag_name="$tag" \
                -f name="$name" \
                -f body="$body" \
                -f target_commitish="$target_commitish" \
                -F draft="$draft" \
                -F prerelease="$prerelease" \
                >/dev/null
            fi

            # Download and upload release assets
            if [[ "$assets" -gt 0 ]]; then

              DIR=$(mktemp -d)

              echo "Downloading $assets assets..."

              gh release download "$tag" \
                --repo "$SOURCE" \
                --dir "$DIR"

              shopt -s nullglob
              files=("$DIR"/*)

              if [[ ${#files[@]} -gt 0 ]]; then
                echo "Uploading assets..."

                gh release upload "$tag" \
                  "${files[@]}" \
                  --repo "$TARGET" \
                  --clobber
              fi

              rm -rf "$DIR"
            fi

            echo "Completed: $tag"

          done

          echo "All releases processed successfully!"
